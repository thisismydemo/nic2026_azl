name: pages

# Builds the follow-along site (follow-along-site/) and publishes it with GitHub Pages under the owner's Pages address (for this account https://thisismydemo.cloud/<repository>/).
# One-time repository setting: Settings, Pages, Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'follow-along-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: follow-along-site/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site
        working-directory: follow-along-site
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_SOURCE_REF: ${{ github.sha }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: follow-along-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
